services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pnc_results
      POSTGRES_USER: pnc_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pnc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pnc_app -d pnc_results"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://pnc_app:${POSTGRES_PASSWORD}@db:5432/pnc_results
      SESSION_COOKIE_SECURE: "true"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pnc_pgdata:
